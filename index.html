<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuSite</title>
    <style>
        body {
            background-color: #f0f4f8; /* Muda a cor de fundo do site */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Muda a fonte do texto */
            max-width: 600px; /* Limita a largura do site para não espalhar muito */
            margin: 40px auto; /* Centraliza a página na tela */
            padding: 20px; /* Cria um espaço interno nas bordas */
            background: white; /* Cria uma "caixa" branca para o conteúdo */
            border-radius: 8px; /* Deixa as bordas arredondadas */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Sombra suave ao redor do site */
        }

        h1 {
            color: #0056b3; /* Cor azul para o título principal */
            text-align: center; /* Centraliza o título */
        }

        h2 {
            color: #333;
            border-bottom: 2px solid #0056b3; /* Cria uma linha abaixo do subtítulo */
            padding-bottom: 5px;
        }

        h3 {
            color: #666;
            font-style: italic; /* Deixa o nome do estudante em itálico */
        }

        p {
            color: #444;
            line-height: 1.6; /* Aumenta o espaço entre as linhas do texto */
            font-size: 16px;
        }

        /* Transforma o link de contato em um botão azul bonito */
        a {
            display: inline-block;
            background-color: #0056b3;
            color: white;
            padding: 10px 20px;
            text-decoration: none; /* Remove o sublinhado padrão do link */
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Efeito de mudar de cor quando passa o mouse por cima do botão */
        a:hover {
            background-color: #003d82;
            text-align: center;
        }
    </style>
    <!-- O CSS termina aqui -->
</head>
<body>
    <h1>Portal Treina Recife</h1>

    <h2>Curso Programação Full-Stack</h2>

    <h3>Estudante: Lucas</h3>
    
    <p>
        Um curso de programação full stack é uma formação que ensina a criar aplicações completas de ponta a ponta, abrangendo tanto a parte visual que o usuário vê quanto os sistemas de servidores e dados nos bastidores.
    </p>

<a href="contato.html">CONTATO</a>

</body>
</html>
